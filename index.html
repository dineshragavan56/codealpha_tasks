<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <h1 class="ultimate-title">Random Quote Generator</h1>

        <div class="quote-container" id="quote-container">
            <h2 class="quote-text" id="quote-text">Loading quote...</h2>
            <p class="quote-author" id="quote-author">Loading author...</p>
        </div>
        
        <button class="btn-new-quote" id="btn-new-quote">Generate Next</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
