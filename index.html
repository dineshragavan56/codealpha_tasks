<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Language Learning App</title>
    <!-- Google Fonts: Nunito (simulates Duolingo's rounded font) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="error-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:red; color:white; padding:20px; z-index:9999; overflow:auto;">
      <h1>Application Error</h1>
      <pre id="error-message"></pre>
    </div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-message').innerText = message + '\n\n' + (error ? error.stack : '');
      };
      window.addEventListener("unhandledrejection", function(event) {
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-message').innerText = "Unhandled Promise Rejection:\n" + event.reason;
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
